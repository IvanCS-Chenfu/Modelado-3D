<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title description">
  <title id="title">Documento, cuerpo y croquis vacío en FreeCAD</title>
  <desc id="description">El documento contiene un Body; dentro aparecen el Origin con sus referencias y un croquis vacío situado en el plano XY. El editor Sketcher muestra los ejes X e Y.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172b45; }
    .title { font-size: 36px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #53677f; }
    .panel-title { font-size: 22px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .detail { font-size: 16px; fill: #53677f; }
    .small { font-size: 15px; fill: #53677f; }
  </style>
  <rect width="1440" height="700" fill="#f3f6fa"/>
  <text x="64" y="68" class="title">Documento, Body y croquis</text>
  <text x="66" y="103" class="subtitle">Lo que aparece en el árbol y en el editor al terminar el apartado 1.1</text>

  <rect x="56" y="136" width="690" height="450" rx="18" fill="#ffffff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="88" y="178" class="panel-title">Árbol del documento</text>
  <text x="88" y="207" class="small">La indentación indica la pertenencia de los objetos.</text>

  <rect x="88" y="232" width="626" height="76" rx="12" fill="#eef3f9" stroke="#d7e1ed"/>
  <path d="M112 251 h28 l13 13 v29 h-41 z M140 251 v14 h13" fill="#ffffff" stroke="#54708e" stroke-width="2" stroke-linejoin="round"/>
  <text x="172" y="264" class="label">Documento</text>
  <text x="172" y="289" class="detail">Archivo .FCStd: contiene el árbol del modelo</text>

  <path d="M130 308 v36 h28" fill="none" stroke="#9aaec4" stroke-width="3"/>
  <rect x="158" y="322" width="524" height="76" rx="12" fill="#e8f2ff" stroke="#8bb8eb" stroke-width="2"/>
  <rect x="180" y="343" width="34" height="34" rx="7" fill="#2f6fb1"/>
  <path d="M188 351 h18 v17 h-18 z M192 347 h18 v17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <text x="232" y="354" class="label">Body (Cuerpo)</text>
  <text x="232" y="379" class="detail">Contenedor de la pieza y sus objetos</text>

  <path d="M194 398 v112 M194 434 h30 M194 510 h30" fill="none" stroke="#9aaec4" stroke-width="3"/>
  <rect x="224" y="412" width="458" height="60" rx="10" fill="#f7f9fc" stroke="#dce4ee"/>
  <circle cx="250" cy="442" r="11" fill="#6c829a"/>
  <path d="M250 431 v22 M239 442 h22" stroke="#ffffff" stroke-width="2"/>
  <text x="278" y="438" class="label">Origin</text>
  <text x="278" y="459" class="small">Planos y ejes de referencia</text>

  <rect x="224" y="488" width="458" height="60" rx="10" fill="#f0f7ff" stroke="#c7ddf5"/>
  <path d="M240 505 h21 v26 h-21 z M245 511 h11 M245 517 h11 M245 523 h8" fill="none" stroke="#2f6fb1" stroke-width="2"/>
  <text x="278" y="514" class="label">Sketch (Croquis)</text>
  <text x="278" y="535" class="small">Vacío y situado sobre el plano XY</text>

  <rect x="780" y="136" width="604" height="450" rx="18" fill="#ffffff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="812" y="178" class="panel-title">Vista del editor Sketcher</text>
  <text x="812" y="207" class="small">El plano XY define los ejes del croquis.</text>

  <rect x="812" y="232" width="540" height="300" rx="12" fill="#fbfcfe" stroke="#dce4ee"/>
  <line x1="850" y1="390" x2="1315" y2="390" stroke="#db4b43" stroke-width="3"/>
  <polygon points="1315,390 1302,383 1302,397" fill="#db4b43"/>
  <line x1="1080" y1="500" x2="1080" y2="260" stroke="#3b9c68" stroke-width="3"/>
  <polygon points="1080,260 1073,273 1087,273" fill="#3b9c68"/>
  <circle cx="1080" cy="390" r="7" fill="#2f6fb1" stroke="#ffffff" stroke-width="2"/>
  <text x="1300" y="420" font-size="17" font-weight="700" fill="#db4b43">X</text>
  <text x="1094" y="278" font-size="17" font-weight="700" fill="#3b9c68">Y</text>
  <text x="1080" y="475" class="detail" text-anchor="middle">Croquis vacío</text>

  <rect x="56" y="610" width="1328" height="64" rx="14" fill="#fff7e7" stroke="#e8cb91"/>
  <circle cx="86" cy="642" r="12" fill="#d69a2d"/>
  <text x="86" y="648" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">i</text>
  <text x="112" y="638" font-size="17" font-weight="700">Resultado de 1.1: documento guardado, un Body, las referencias de Origin y un croquis vacío.</text>
  <text x="112" y="661" class="small">El ejercicio termina aquí; todavía no se ha dibujado geometría en el croquis.</text>
</svg>
