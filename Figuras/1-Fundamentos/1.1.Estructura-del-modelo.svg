<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Del documento al sólido en FreeCAD Part Design</title>
  <desc id="description">El documento contiene un Body con Origin, un croquis y operaciones. Una operación como Pad o Pocket calcula la forma sólida tridimensional del Body.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#55708f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b45; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #53677f; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 16px; fill: #53677f; }
      .small { font-size: 15px; fill: #53677f; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#f3f6fa"/>
  <text x="64" y="68" class="title">Del documento al sólido</text>
  <text x="66" y="103" class="subtitle">Cómo se organiza una pieza en el árbol de FreeCAD y de dónde sale su forma 3D</text>

  <rect x="56" y="136" width="824" height="500" rx="18" fill="#ffffff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="88" y="178" class="panel-title">Árbol del documento</text>
  <text x="88" y="207" class="small">La indentación muestra qué objetos están dentro de cada contenedor.</text>

  <rect x="88" y="232" width="760" height="76" rx="12" fill="#eef3f9" stroke="#d7e1ed"/>
  <path d="M112 251 h28 l13 13 v29 h-41 z" fill="#ffffff" stroke="#54708e" stroke-width="2"/>
  <path d="M140 251 v14 h13" fill="none" stroke="#54708e" stroke-width="2"/>
  <text x="172" y="264" class="label">Documento</text>
  <text x="172" y="289" class="detail">Archivo .FCStd: contiene el árbol del modelo</text>

  <path d="M130 308 v36 h28" fill="none" stroke="#9aaec4" stroke-width="3"/>
  <rect x="158" y="322" width="656" height="76" rx="12" fill="#e8f2ff" stroke="#8bb8eb" stroke-width="2"/>
  <rect x="180" y="343" width="34" height="34" rx="7" fill="#2f6fb1"/>
  <path d="M188 351 h18 v17 h-18 z M192 347 h18 v17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <text x="232" y="354" class="label">Body (Cuerpo)</text>
  <text x="232" y="379" class="detail">Contenedor de la pieza y de su historial de operaciones</text>

  <path d="M194 398 v42 M194 420 h30 M194 462 h30 M194 504 h30" fill="none" stroke="#9aaec4" stroke-width="3"/>

  <rect x="224" y="406" width="590" height="60" rx="10" fill="#f7f9fc" stroke="#dce4ee"/>
  <circle cx="250" cy="436" r="11" fill="#6c829a"/>
  <path d="M250 425 v22 M239 436 h22" stroke="#ffffff" stroke-width="2"/>
  <text x="278" y="432" class="label">Origin</text>
  <text x="278" y="453" class="small">Planos y ejes de referencia</text>

  <rect x="224" y="476" width="590" height="60" rx="10" fill="#f0f7ff" stroke="#c7ddf5"/>
  <path d="M240 494 h21 v24 h-21 z M245 499 h11 M245 505 h11 M245 511 h8" fill="none" stroke="#2f6fb1" stroke-width="2"/>
  <text x="278" y="502" class="label">Sketch (Croquis)</text>
  <text x="278" y="523" class="small">Perfil 2D situado sobre un plano</text>

  <rect x="224" y="546" width="590" height="60" rx="10" fill="#fff8eb" stroke="#e9c47e" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M242 565 h22 v22 h-22 z M247 560 h22 v22" fill="none" stroke="#b77b14" stroke-width="2"/>
  <text x="278" y="572" class="label">Pad / Pocket</text>
  <text x="278" y="593" class="small">Operación: añade o quita material usando el croquis</text>

  <rect x="914" y="136" width="470" height="500" rx="18" fill="#ffffff" stroke="#d5dfeb" stroke-width="2"/>
  <text x="946" y="178" class="panel-title">Forma calculada del Body</text>
  <text x="946" y="207" class="small">La operación actualiza el resultado geométrico.</text>

  <path d="M834 576 C884 576 884 510 931 510" fill="none" stroke="#55708f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="845" y="527" width="103" height="28" rx="14" fill="#ffffff" stroke="#cbd7e4"/>
  <text x="896" y="546" class="small" text-anchor="middle">genera</text>

  <g transform="translate(1045 302)">
    <path d="M0 65 L105 5 L210 65 L105 126 Z" fill="#d6e8fa" stroke="#356c9f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M0 65 L105 126 V250 L0 188 Z" fill="#8db9e6" stroke="#356c9f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M105 126 L210 65 V188 L105 250 Z" fill="#6096ca" stroke="#356c9f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M105 126 V250" fill="none" stroke="#356c9f" stroke-width="3"/>
  </g>
  <text x="1149" y="588" class="label" text-anchor="middle">Sólido 3D</text>
  <text x="1149" y="613" class="small" text-anchor="middle">Forma resultante de la secuencia</text>

  <rect x="56" y="658" width="1328" height="64" rx="14" fill="#fff7e7" stroke="#e8cb91"/>
  <circle cx="86" cy="690" r="12" fill="#d69a2d"/>
  <text x="86" y="696" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">i</text>
  <text x="112" y="686" font-size="17" font-weight="700">En el archivo de práctica actual hay un documento, un Body y un croquis vacío.</text>
  <text x="112" y="709" class="small">Pad/Pocket y el sólido aparecen al añadir la primera operación.</text>
</svg>
